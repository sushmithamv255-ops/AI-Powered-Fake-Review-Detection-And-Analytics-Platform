{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card mt-4">
      <div class="card-header">Reset Password</div>
      <div class="card-body">
        <p class="text-muted small">Enter your username and the email on your account to set a
          new password. (Demo simplification: no email server is used.)</p>
        <form method="POST" action="{{ url_for('forgot_password') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" name="new_password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-brand w-100">Reset Password</button>
        </form>
        <p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">Back to login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
